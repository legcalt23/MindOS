name: iOS Build

# iOS drift-detection: compiles the shared Kotlin Multiplatform iOS targets on a
# macOS runner. The iOS targets are only declared `if (isMacOs)` in
# shared/build.gradle.kts, so this is the ONLY environment that can catch iOS
# `actual` drift.
#
# iOS remains deferred from v1 (Android-first; see IOS_STATUS.md). This workflow
# does not publish or package an iOS app; it only blocks KMP source-set drift.

on:
  push:
    branches: [ main ]
    paths:
      - 'shared/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  pull_request:
    branches: [ main ]
    paths:
      - 'shared/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-compile:
    name: Shared — compile iOS targets
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Firebase iOS SDK 11.8.0 (the version gitlive 2.4.0 links) is built with Swift 6
      # (`sending`, `public import`), which the runner's default Xcode 15.4 / Swift 5.10
      # cannot parse. Select the newest installed Xcode 16.x; fail loudly, listing what is
      # available, if none is present (so a missing-toolchain run reads as a distinct fact).
      - name: Select newest Xcode 16
        run: |
          set -e
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "No Xcode 16.x found. Available:"; ls -d /Applications/Xcode_*.app; exit 1
          fi
          echo "Selecting $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          swift --version

      # Compiles the iOS simulator + device frameworks without needing an Xcode
      # project. This is the cheapest way to verify the shared iOS actuals build.
      - name: Compile shared iOS frameworks
        run: |
          ./gradlew :shared:compileKotlinIosSimulatorArm64 \
                    :shared:compileKotlinIosArm64 \
                    --no-daemon --stacktrace

      # Runs the shared KMP test suites (commonTest + iosTest) ON the iOS simulator.
      # macos-14 runners are Apple Silicon, so the iosSimulatorArm64 test binary runs
      # natively — this is the parity evidence the local Intel/Monterey Mac cannot
      # produce (its simulator is x86 and its Xcode is capped at 14.x). Split into its
      # own step so a compile failure and a test failure read as distinct facts.
      - name: Run shared iOS simulator tests
        run: |
          ./gradlew :shared:iosSimulatorArm64Test --no-daemon --stacktrace
