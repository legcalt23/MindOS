<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind OS — Intro Preview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #05060A;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #replay-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 10px 20px;
            background: rgba(123, 107, 255, 0.15);
            border: 1px solid rgba(123, 107, 255, 0.4);
            color: #F5F0FF;
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 100;
        }
        #replay-btn:hover {
            background: rgba(123, 107, 255, 0.25);
            border-color: rgba(123, 107, 255, 0.7);
        }
        #timer {
            position: fixed;
            top: 16px;
            right: 24px;
            color: rgba(245, 240, 255, 0.4);
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 12px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="timer">0.000s</div>
    <button id="replay-btn">Replay</button>
    <script src="intro.js"></script>
</body>
</html>
