name: Android Instrumented (manual)

# Runs Android instrumented tests on a Gradle Managed Device (headless emulator).
# Manual trigger: GMD downloads a system image and needs KVM, so it is heavier
# than the unit-test CI — kept opt-in until the critical-flow instrumented tests
# (login / DM / wallet) are fleshed out on top of SmokeInstrumentedTest.
#
# Local equivalent: ./gradlew :androidApp:pixel6Api34DebugAndroidTest

on:
  workflow_dispatch:

concurrency:
  group: android-instrumented-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instrumented:
    name: androidApp — managed device tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run instrumented tests on Gradle Managed Device
        run: ./gradlew :androidApp:pixel6Api34DebugAndroidTest --no-daemon --stacktrace

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: androidApp/build/reports/androidTests/
          retention-days: 14
