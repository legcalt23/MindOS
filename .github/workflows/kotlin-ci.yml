name: Kotlin CI

# Validates shared Kotlin Multiplatform code and Android app build.
# Triggered on every push to main and every PR targeting main.
# Runs:
#   - Shared desktop unit tests (commonTest + desktopTest)
#   - Android debug build (assembleDebug)
#   - Detekt static analysis (with baseline)

on:
  push:
    branches: [ main ]
    paths:
      - 'shared/**'
      - 'androidApp/**'
      - 'desktopApp/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  pull_request:
    branches: [ main ]
    paths:
      - 'shared/**'
      - 'androidApp/**'
      - 'desktopApp/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'

concurrency:
  group: kotlin-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Shared KMP unit tests (runs on JVM/Desktop — no emulator needed)
  # ────────────────────────────────────────────────────────────────────────
  shared-tests:
    name: Shared — unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run shared desktop tests
        run: ./gradlew :shared:desktopTest --no-daemon --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-results
          path: shared/build/reports/tests/desktopTest/
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────────
  # Android debug build — ensures the app compiles and links correctly
  # ────────────────────────────────────────────────────────────────────────
  android-build:
    name: Android — assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build Android debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────
  # Detekt static analysis — uses existing baseline to avoid noise
  # ────────────────────────────────────────────────────────────────────────
  detekt:
    name: Shared — detekt
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run detekt
        run: ./gradlew :shared:detekt --no-daemon --stacktrace

      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: shared/build/reports/detekt/
          retention-days: 14
