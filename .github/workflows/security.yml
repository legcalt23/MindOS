name: Security

# Catches advisories that drift in AFTER a dependency was vetted.
# Runs:
#   - On manual dispatch
#   - Weekly (Monday 06:00 UTC)
#
# This is intentionally separate from CI so a newly-published CVE against an
# unchanged dependency surfaces even on a quiet week.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (functions, prod deps)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: functions

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies (locked)
        run: npm ci

      # Production-only. Dev advisories shouldn't fail the weekly job since
      # they don't ship; surface them separately via the JSON output.
      - name: Audit production dependencies (fail on high)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit ALL dependencies (informational, never fails)
        run: npm audit --json > npm-audit-all.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-audit-report
          path: functions/npm-audit-all.json
          retention-days: 14

  secret-scan:
    name: Repo secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Scan
        run: node functions/scripts/scan-secrets.js
