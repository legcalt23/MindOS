name: iOS Build

# iOS drift-detection: compiles the shared Kotlin Multiplatform iOS targets on a
# macOS runner. The iOS targets are only declared `if (isMacOs)` in
# shared/build.gradle.kts, so this is the ONLY environment that can catch iOS
# `actual` drift.
#
# iOS remains deferred from v1 (Android-first; see IOS_STATUS.md). This workflow
# does not publish or package an iOS app; it only blocks KMP source-set drift.

on:
  push:
    branches: [ main ]
    paths:
      - 'shared/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  pull_request:
    branches: [ main ]
    paths:
      - 'shared/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-compile:
    name: Shared — compile iOS targets
    runs-on: macos-14
    # Cold builds compile the full Firebase pod set from source (Firestore drags in
    # gRPC-C++/BoringSSL/abseil/leveldb), and nothing here is cached across runs, so the
    # 40-min default was not enough. macOS minutes bill at 10x, so this is a ceiling, not
    # a target — once a green baseline exists, pod-build caching can bring it down.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Firebase iOS SDK 11.8.0 (the version gitlive 2.4.0 links) is built with Swift 6
      # (`sending`, `public import`), which the runner's default Xcode 15.4 / Swift 5.10
      # cannot parse. Select the newest installed Xcode 16.x; fail loudly, listing what is
      # available, if none is present (so a missing-toolchain run reads as a distinct fact).
      - name: Select newest Xcode 16
        run: |
          set -e
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "No Xcode 16.x found. Available:"; ls -d /Applications/Xcode_*.app; exit 1
          fi
          echo "Selecting $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          swift --version

      # Drift gate: compile ONLY the iosSimulatorArm64 target. The iosMain `actual`
      # declarations are shared by both iOS targets, so compiling one arch catches all
      # `actual` drift — while building pods for a single arch roughly halves the cold
      # build vs. also compiling iosArm64 (device). The device target stays declared in
      # build.gradle.kts for the eventual Xcode app; it is just not exercised by this gate.
      #
      # The iosSimulatorArm64Test step (running the KMP suite ON the simulator) is added
      # back once this compile baseline is green — it links the full native Firebase SDK,
      # so it is isolated as a second milestone rather than risking the first one's budget.
      - name: Compile shared iOS framework (simulator arch — actual-drift gate)
        run: |
          ./gradlew :shared:compileKotlinIosSimulatorArm64 --no-daemon --stacktrace
